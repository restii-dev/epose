<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<link rel="icon" href="../image/favi.png">
<style>
  :root {
    --bg: #101010; --bg2: #151515; --panel: #181818; --panel2: #202020;
    --border: #2b2b2b; --text: #f2f2f2; --muted: #888; --ok: #5dcc7a; --bad: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  #brand { display: none; margin-bottom: 18px; animation: up .28s ease; }
  #brand.show { display: block; }
  #brand h1 { font-size: 18px; font-weight: 650; }
  #brand p { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; margin-bottom: 12px; animation: up .3s ease both;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.45; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); padding: 0 12px; font-size: 13px; outline: none;
  }
  input:focus { border-color: #444; }
  button {
    height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 13px; font-weight: 600;
    padding: 0 14px; cursor: pointer;
  }
  button:hover { border-color: #444; }
  button.main { background: #fff; color: #111; border: 0; }
  button.red { border-color: #5a2020; color: #ff8a8a; background: transparent; }
  button.sm { height: 32px; font-size: 12px; padding: 0 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 120px; }
  .msg { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 16px; transition: opacity .3s; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .keybox {
    margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--bg2);
    border: 1px solid var(--border); font-family: ui-monospace, monospace; font-size: 13px;
    word-break: break-all;
  }
  #loginView, #appView { display: none; }
  #loginView.show, #appView.show { display: block; }
  .login { max-width: 360px; margin: 12vh auto 0; text-align: center; }
  .ip-row {
    border: 1px solid var(--border); border-radius: 12px; margin-top: 8px;
    background: var(--bg2); overflow: hidden; animation: up .25s ease;
  }
  .ip-main {
    display: flex; align-items: center; gap: 10px; padding: 12px;
    cursor: pointer; flex-wrap: wrap;
  }
  .ip-main:hover { background: var(--panel2); }
  .ip-addr { font-family: ui-monospace, monospace; font-size: 12px; flex: 1; min-width: 120px; }
  .ip-label { font-size: 12px; color: var(--muted); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .tag.ok { background: rgba(93,204,122,.12); color: var(--ok); }
  .tag.bad { background: rgba(255,92,92,.12); color: var(--bad); }
  .tag.mute { background: rgba(255,255,255,.05); color: var(--muted); }
  .ip-detail {
    display: none; border-top: 1px solid var(--border); padding: 12px;
    background: var(--panel); animation: slide .28s ease;
  }
  .ip-detail.open { display: block; }
  .ip-detail .detail { font-size: 12px; color: var(--muted); line-height: 1.6; display: grid; gap: 4px; margin-bottom: 12px; }
  .ip-detail .detail b { color: var(--text); }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes slide { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 600px; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="brand">
    <h1>Admin Panel</h1>
    <p>Manage keys and IPs</p>
  </div>

  <div id="loginView">
    <div class="card login">
      <h2>Log in</h2>
      <p class="hint">Enter the admin password. Required every time this page loads.</p>
      <label style="text-align:left">Password</label>
      <input id="adminPass" type="password" placeholder="Admin password" autocomplete="current-password">
      <button class="main" id="loginBtn" type="button" style="width:100%;margin-top:12px">Log in</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <div id="appView">
    <div class="card">
      <h2>Create a key</h2>
      <p class="hint">One-time key so someone can unlock Veil.</p>
      <label>Duration</label>
      <div class="row">
        <input id="keyDur" value="1h" placeholder="30m, 2h, 1d, inf">
        <button class="main" id="genKey" type="button">Create key</button>
      </div>
      <div class="msg" style="margin-top:8px">Examples: 30m · 2h · 1d · 2d;30m · inf</div>
      <div class="keybox" id="keyOut">No key yet</div>
      <div class="msg" id="keyMsg"></div>
    </div>

    <div class="card">
      <h2>Sign everyone out</h2>
      <p class="hint">Ends all sessions without blocking anyone.</p>
      <button class="red" id="signoutAll" type="button">Sign everyone out</button>
      <div class="msg" id="globalMsg"></div>
    </div>

    <div class="card">
      <h2>IP log</h2>
      <button id="refreshIps" type="button">Refresh</button>
      <div id="ipList"></div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
</body>
</html>
