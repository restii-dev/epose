<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veil Admin</title>
<link rel="icon" href="../image/favi.png">
<style>
  :root {
    --bg: #101010;
    --bg2: #151515;
    --panel: #181818;
    --panel2: #202020;
    --border: #2b2b2b;
    --text: #f2f2f2;
    --muted: #888888;
    --accent: #ffffff;
    --accentText: #111111;
    --ok: #5dcc7a;
    --bad: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
  .top { margin-bottom: 22px; animation: fadeUp .35s ease both; }
  .top h1 { font-size: 18px; font-weight: 650; }
  .top p { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
    animation: fadeUp .4s ease both;
  }
  .card h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); padding: 0 12px; font-size: 13px; outline: none;
  }
  input:focus { border-color: #444; }
  button {
    height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 13px; font-weight: 600;
    padding: 0 14px; cursor: pointer;
  }
  button:hover { border-color: #444; }
  button.main { background: var(--accent); color: var(--accentText); border-color: transparent; }
  button.red { background: rgba(255,92,92,.1); border-color: rgba(255,92,92,.28); color: #ff8a8a; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 150px; }
  .msg { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 16px; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--ok); }
  .keybox {
    margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--bg2);
    border: 1px solid var(--border); font-family: ui-monospace, monospace; font-size: 14px;
    word-break: break-all;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .tag.ok { background: rgba(93,204,122,.12); color: var(--ok); }
  .tag.bad { background: rgba(255,92,92,.12); color: var(--bad); }
  .tag.mute { background: rgba(255,255,255,.05); color: var(--muted); }
  .actions button { height: 30px; font-size: 11px; padding: 0 10px; }
  #loginView, #appView { display: none; }
  #loginView.show, #appView.show { display: block; }
  .login { max-width: 380px; margin: 12vh auto 0; text-align: center; }
  .login h2 { font-size: 20px; color: var(--text); margin-bottom: 6px; }
  .login p { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
  .detail { font-size: 12px; color: var(--muted); line-height: 1.6; display: grid; gap: 4px; }
  .detail b { color: var(--text); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Veil Admin</h1>
    <p>Keys, IPs, and sessions</p>
  </div>

  <div id="loginView">
    <div class="card login">
      <h2>Admin login</h2>
      <p>Enter the admin password. You will need it again if this page reloads.</p>
      <label style="text-align:left">Password</label>
      <input id="adminPass" type="password" placeholder="Admin password" autocomplete="current-password">
      <button class="main" id="loginBtn" type="button" style="width:100%;margin-top:12px">Log in</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <div id="appView">
    <div class="card">
      <h2>Create key</h2>
      <label>Duration</label>
      <div class="row">
        <input id="keyDur" value="1h" placeholder="30m, 2h, 1d, 2d;30m, inf">
        <button class="main" id="genKey" type="button">Create key</button>
      </div>
      <div class="msg" style="margin-top:8px">Examples: 30s · 15m · 2h · 1d · 2d;30m · inf</div>
      <div class="keybox" id="keyOut">No key yet</div>
      <div class="msg" id="keyMsg"></div>
    </div>

    <div class="card">
      <h2>Sign everyone out</h2>
      <p class="msg" style="margin:0 0 12px">Ends all sessions. Users need a new key.</p>
      <button class="red" id="signoutAll" type="button">Sign everyone out</button>
      <div class="msg" id="globalMsg"></div>
    </div>

    <div class="card">
      <h2>IP log</h2>
      <button id="refreshIps" type="button">Refresh</button>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th>IP</th><th>Status</th><th>Access</th><th>Time left</th><th>Key</th><th></th></tr>
          </thead>
          <tbody id="ipBody"></tbody>
        </table>
      </div>
      <div id="ipDetail" class="card" style="display:none;margin-top:12px;background:var(--bg2)">
        <h2>IP details</h2>
        <div class="detail" id="ipDetailText"></div>
        <div class="row" style="margin-top:12px">
          <input id="blockDur" placeholder="Block time e.g. 30m, 2h, 1d, inf">
          <button class="red" id="blockBtn" type="button">Block</button>
          <button id="unblockBtn" type="button">Unblock</button>
        </div>
        <div class="msg" id="blockMsg"></div>
      </div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
</body>
</html>
