<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Epose</title>
<style>
html,body{margin:0;height:100%;background:#101010;color:#f2f2f2;font-family:system-ui,sans-serif}
#load{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px}
#load span{color:#888;font-size:13px}
</style>
</head>
<body>
<div id="load">Loading Epose…<span>Preparing login</span></div>
<script>
(async function () {
  try {
    var res = await fetch("app.b64.txt?v=2");
    if (!res.ok) throw new Error("app.b64.txt " + res.status);
    var b64 = (await res.text()).trim();
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (typeof DecompressionStream === "undefined") {
      throw new Error("Browser cannot decompress; use a modern Chrome/Edge/Firefox/Safari");
    }
    var ds = new DecompressionStream("gzip");
    var stream = new Blob([bytes]).stream().pipeThrough(ds);
    var html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    var el = document.getElementById("load");
    if (el) el.innerHTML = "Failed to load Epose<br><span>" + String(e.message || e) + "</span>";
  }
})();
</script>
</body>
</html>
